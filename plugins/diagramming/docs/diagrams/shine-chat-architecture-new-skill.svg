<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1120" width="1320" height="1120">
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 800; fill: #111827; }
      .subtitle { font-size: 14px; fill: #475569; }
      .group-label { font-size: 15px; font-weight: 800; fill: #334155; }
      .node-title { font-size: 16px; font-weight: 800; fill: #111827; }
      .node-subtitle { font-size: 12px; fill: #475569; }
      .chip { font-size: 11px; font-weight: 800; fill: #ffffff; }
      .generated-chip { font-size: 11px; font-weight: 800; fill: #0369a1; }
      .arrow-label { font-size: 11px; font-weight: 700; fill: #334155; }
    </style>
    <marker id="primaryArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="toolArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="modelArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <pattern id="generatedHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0284c7" stroke-width="1.2" opacity="0.24"/>
    </pattern>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1320" height="1120" fill="#ffffff"/>
  <text x="660" y="48" text-anchor="middle" class="title">SHINE Chat Architecture</text>
  <text x="660" y="76" text-anchor="middle" class="subtitle">Frontend chat streams through the API into Databricks AI Gateway, with model calls routed to Bedrock and tool calls routed to SharePoint.</text>

  <rect x="1032" y="36" width="170" height="28" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="1032" y="36" width="170" height="28" rx="14" fill="url(#generatedHatch)" stroke="#0284c7" stroke-width="1.3"/>
  <text x="1117" y="55" text-anchor="middle" class="generated-chip">GENERATED DIAGRAM</text>

  <g filter="url(#softShadow)">
    <rect x="520" y="112" width="280" height="92" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  </g>
  <text x="660" y="150" text-anchor="middle" class="node-title">Frontend</text>
  <text x="660" y="176" text-anchor="middle" class="node-subtitle">SHINE chat UI</text>

  <rect x="140" y="268" width="900" height="260" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="166" y="301" class="group-label">API</text>

  <g filter="url(#softShadow)">
    <rect x="246" y="322" width="290" height="92" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  </g>
  <text x="391" y="358" text-anchor="middle" class="node-title">/shine/chat</text>
  <text x="391" y="383" text-anchor="middle" class="node-subtitle">HTTP request</text>
  <rect x="434" y="388" width="78" height="22" rx="11" fill="#4f46e5"/>
  <text x="473" y="403" text-anchor="middle" class="chip">SSE</text>

  <g filter="url(#softShadow)">
    <rect x="598" y="322" width="252" height="92" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  </g>
  <text x="724" y="358" text-anchor="middle" class="node-title">Chat Request Port</text>
  <text x="724" y="383" text-anchor="middle" class="node-subtitle">hexagonal boundary</text>

  <g filter="url(#softShadow)">
    <rect x="598" y="438" width="252" height="74" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  </g>
  <text x="724" y="470" text-anchor="middle" class="node-title">App Kit DBX Adapter</text>
  <text x="724" y="492" text-anchor="middle" class="node-subtitle">Databricks boundary</text>

  <rect x="140" y="604" width="900" height="316" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="166" y="637" class="group-label">DBX</text>

  <rect x="226" y="646" width="740" height="188" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="250" y="676" class="group-label">AI Gateway</text>

  <g filter="url(#softShadow)">
    <rect x="330" y="704" width="242" height="74" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  </g>
  <text x="451" y="737" text-anchor="middle" class="node-title">LLM Proxy</text>
  <text x="451" y="759" text-anchor="middle" class="node-subtitle">model traffic</text>

  <g filter="url(#softShadow)">
    <rect x="652" y="704" width="242" height="74" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  </g>
  <text x="773" y="737" text-anchor="middle" class="node-title">MCP Proxy</text>
  <text x="773" y="759" text-anchor="middle" class="node-subtitle">tool traffic</text>

  <g filter="url(#softShadow)">
    <rect x="330" y="824" width="242" height="74" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  </g>
  <text x="451" y="855" text-anchor="middle" class="node-title">Model Serving</text>
  <text x="451" y="877" text-anchor="middle" class="node-subtitle">endpoint</text>

  <g filter="url(#softShadow)">
    <rect x="652" y="824" width="242" height="74" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  </g>
  <text x="773" y="867" text-anchor="middle" class="node-title">Agent</text>

  <g filter="url(#softShadow)">
    <rect x="1092" y="704" width="170" height="74" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="1177" y="737" text-anchor="middle" class="node-title">SharePoint</text>
  <text x="1177" y="759" text-anchor="middle" class="node-subtitle">content tools</text>

  <rect x="140" y="982" width="900" height="88" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="166" y="1015" class="group-label">AWS Bedrock</text>

  <g filter="url(#softShadow)">
    <rect x="478" y="1004" width="284" height="48" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="620" y="1034" text-anchor="middle" class="node-title">Sonnet 4.5</text>

  <path d="M660 204 L660 248 L391 248 L391 320" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#primaryArrow)"/>
  <rect x="486" y="237" width="112" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
  <text x="542" y="253" text-anchor="middle" class="arrow-label">chat request</text>

  <path d="M434 388 L434 238 L686 238 L686 204" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#primaryArrow)"/>
  <rect x="542" y="226" width="92" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
  <text x="588" y="242" text-anchor="middle" class="arrow-label">SSE stream</text>

  <path d="M536 368 L596 368" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#primaryArrow)"/>
  <path d="M724 414 L724 436" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#primaryArrow)"/>
  <path d="M724 512 L724 568 L451 568 L451 702" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#primaryArrow)"/>
  <rect x="535" y="557" width="146" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
  <text x="608" y="573" text-anchor="middle" class="arrow-label">invoke gateway</text>

  <path d="M451 778 L451 822" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#modelArrow)"/>
  <rect x="466" y="793" width="96" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
  <text x="514" y="809" text-anchor="middle" class="arrow-label">model call</text>

  <path d="M572 861 L650 861" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#modelArrow)"/>
  <rect x="592" y="842" width="52" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
  <text x="618" y="858" text-anchor="middle" class="arrow-label">plan</text>

  <path d="M773 824 L773 780" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#toolArrow)"/>
  <rect x="790" y="794" width="78" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
  <text x="829" y="810" text-anchor="middle" class="arrow-label">tool call</text>

  <path d="M894 741 L1090 741" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#toolArrow)"/>
  <rect x="970" y="722" width="88" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
  <text x="1014" y="738" text-anchor="middle" class="arrow-label">retrieve docs</text>

  <path d="M451 898 L451 946 L620 946 L620 1002" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#modelArrow)"/>
  <rect x="478" y="935" width="120" height="22" rx="11" fill="#ffffff" opacity="0.95"/>
  <text x="538" y="951" text-anchor="middle" class="arrow-label">serve model</text>

  <rect x="1012" y="832" width="224" height="132" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1038" y="860" class="group-label">Flow legend</text>
  <line x1="1040" y1="890" x2="1090" y2="890" stroke="#2563eb" stroke-width="2.4" marker-end="url(#primaryArrow)"/>
  <text x="1102" y="895" class="node-subtitle">request and stream</text>
  <line x1="1040" y1="922" x2="1090" y2="922" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#modelArrow)"/>
  <text x="1102" y="927" class="node-subtitle">model path</text>
  <line x1="1040" y1="954" x2="1090" y2="954" stroke="#059669" stroke-width="2.4" marker-end="url(#toolArrow)"/>
  <text x="1102" y="959" class="node-subtitle">tool path</text>
</svg>
