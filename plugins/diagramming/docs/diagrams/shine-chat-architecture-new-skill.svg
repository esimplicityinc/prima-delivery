<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1180" width="1500" height="1180">
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 800; fill: #111827; }
      .subtitle { font-size: 14px; fill: #475569; }
      .group-label { font-size: 15px; font-weight: 800; fill: #334155; }
      .callout-label { font-size: 14px; font-weight: 800; fill: #334155; }
      .node-title { font-size: 15px; font-weight: 800; fill: #111827; }
      .node-subtitle { font-size: 12px; fill: #475569; }
      .badge { font-size: 11px; font-weight: 800; fill: #ffffff; }
      .generated-chip { font-size: 11px; font-weight: 800; fill: #0369a1; }
      .arrow-label { font-size: 11px; font-weight: 700; fill: #334155; }
      .step-number { font-size: 14px; font-weight: 900; fill: #334155; }
    </style>
    <marker id="requestArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="toolArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="modelArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="implementArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <pattern id="generatedHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#0284c7" stroke-width="1.2" opacity="0.24"/></pattern>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.13"/></filter>
