<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1180" width="1280" height="1180">
  <defs>
    <marker id="arrow-data" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-trigger" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="arrow-auth" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <marker id="arrow-verify" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="arrow-user" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .title { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 14px; font-weight: 500; fill: #64748b; }
      .lane-header { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 1.4px; }
      .node-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .node-sub { font-size: 11px; font-weight: 500; fill: #64748b; }
      .node-meta { font-size: 11px; font-weight: 500; fill: #475569; }
      .arrow-label { font-size: 11px; font-weight: 600; fill: #475569; }
      .source-attr { font-size: 11px; font-weight: 500; fill: #94a3b8; font-style: italic; }
      .legend-text { font-size: 12px; font-weight: 500; fill: #475569; }
    </style>
  </defs>
  <rect width="1280" height="1180" fill="#ffffff"/>
  <text x="40" y="50" class="title">SHINE Portal Deployment</text>
  <text x="40" y="74" class="subtitle">content-portal repo to Databricks Apps (dev + prod) via GitHub Actions + AWS OIDC</text>
  <rect x="30" y="105" width="1220" height="165" rx="10" fill="#fef3c7" fill-opacity="0.4" stroke="#fcd34d" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="50" y="127" class="lane-header">SOURCE</text>
  <rect x="30" y="290" width="1220" height="145" rx="10" fill="#dbeafe" fill-opacity="0.4" stroke="#93c5fd" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="50" y="312" class="lane-header">GITHUB ACTIONS WORKFLOWS</text>
  <rect x="30" y="455" width="1220" height="145" rx="10" fill="#fef9c3" fill-opacity="0.4" stroke="#fde047" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="50" y="477" class="lane-header">BUILD JOB (ubuntu-latest)</text>
  <rect x="30" y="620" width="1220" height="165" rx="10" fill="#dcfce7" fill-opacity="0.4" stroke="#86efac" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="50" y="642" class="lane-header">DEPLOY JOB (environment: dev | prod)</text>
  <rect x="30" y="805" width="1220" height="165" rx="10" fill="#cffafe" fill-opacity="0.4" stroke="#67e8f9" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="50" y="827" class="lane-header">DATABRICKS APPS RUNTIME</text>
  <rect x="30" y="990" width="1220" height="145" rx="10" fill="#f3e8ff" fill-opacity="0.4" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="50" y="1012" class="lane-header">POST-DEPLOY + USERS</text>
  <rect x="70" y="145" width="200" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.0" y="171" text-anchor="middle" class="node-title">Developer</text>
  <text x="170.0" y="191" text-anchor="middle" class="node-sub">git push / release</text>
  <rect x="310" y="145" width="230" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="425.0" y="171" text-anchor="middle" class="node-title">GitHub: main branch</text>
  <text x="425.0" y="191" text-anchor="middle" class="node-sub">push event</text>
  <rect x="580" y="145" width="220" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="690.0" y="171" text-anchor="middle" class="node-title">GitHub Release</text>
  <text x="690.0" y="191" text-anchor="middle" class="node-sub">release.published event</text>
  <rect x="870" y="145" width="350" height="75" rx="8" fill="#fef9c3" stroke="#facc15" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.0" y="171" text-anchor="middle" class="node-title">AWS IAM (OIDC trust)</text>
  <text x="1045.0" y="191" text-anchor="middle" class="node-sub">role-to-assume via vars.AWS_ROLE_ARN</text>
  <rect x="70" y="330" width="350" height="90" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="245.0" y="356" text-anchor="middle" class="node-title">CD – Dev (deploy.yml)</text>
  <text x="245.0" y="376" text-anchor="middle" class="node-sub">trigger: push to main / workflow_dispatch</text>
  <rect x="460" y="330" width="360" height="90" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="356" text-anchor="middle" class="node-title">CD – Prod (deploy-prod.yml)</text>
  <text x="640.0" y="376" text-anchor="middle" class="node-sub">trigger: release published</text>
  <rect x="870" y="330" width="350" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.0" y="356" text-anchor="middle" class="node-title">Each workflow has 3 jobs</text>
  <text x="1045.0" y="376" text-anchor="middle" class="node-sub">build → deploy → (dev only) bdd-post-deploy + release</text>
  <rect x="70" y="495" width="280" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="519" text-anchor="middle" class="node-title">Astro frontend build</text>
  <text x="210.0" y="537" text-anchor="middle" class="node-sub">Node 22 + just app-astro-build</text>
  <text x="210.0" y="557" text-anchor="middle" class="node-meta">cwd: content-portal/</text>
  <rect x="390" y="495" width="270" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="525.0" y="519" text-anchor="middle" class="node-title">content-portal/dist/</text>
  <text x="525.0" y="537" text-anchor="middle" class="node-sub">static Astro output</text>
  <text x="525.0" y="557" text-anchor="middle" class="node-meta">(SHINE, FOE, RIC, Prima)</text>
  <rect x="700" y="495" width="280" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="840.0" y="519" text-anchor="middle" class="node-title">Upload Artifact</text>
  <text x="840.0" y="537" text-anchor="middle" class="node-sub">name: dist-${{ github.sha }}</text>
  <text x="840.0" y="557" text-anchor="middle" class="node-meta">retention: 7 days</text>
  <rect x="1010" y="495" width="220" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0" y="519" text-anchor="middle" class="node-title">Build is identical dev &amp; prod</text>
  <text x="1120.0" y="537" text-anchor="middle" class="node-sub">prod is artifact promotion from</text>
  <text x="1120.0" y="557" text-anchor="middle" class="node-meta">the release commit SHA</text>
  <rect x="70" y="660" width="240" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="684" text-anchor="middle" class="node-title">Download dist artifact</text>
  <text x="190.0" y="702" text-anchor="middle" class="node-sub">extract into api/public/</text>
  <text x="190.0" y="722" text-anchor="middle" class="node-meta">+ npm ci in api/</text>
  <rect x="345" y="660" width="230" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="460.0" y="684" text-anchor="middle" class="node-title">bundle validate</text>
  <text x="460.0" y="702" text-anchor="middle" class="node-sub">databricks bundle validate</text>
  <text x="460.0" y="722" text-anchor="middle" class="node-meta">-t dev | -t prod</text>
  <rect x="605" y="660" width="230" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="720.0" y="684" text-anchor="middle" class="node-title">bundle deploy</text>
  <text x="720.0" y="702" text-anchor="middle" class="node-sub">syncs api/ to Workspace path</text>
  <text x="720.0" y="722" text-anchor="middle" class="node-meta">per databricks.yml target</text>
  <rect x="870" y="660" width="360" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="684" text-anchor="middle" class="node-title">bundle run shine_portal</text>
  <text x="1050.0" y="702" text-anchor="middle" class="node-sub">starts the Databricks App</text>
  <text x="1050.0" y="722" text-anchor="middle" class="node-meta">captures app_url output</text>
  <rect x="70" y="770" width="240" height="60" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="796" text-anchor="middle" class="node-title">AWS OIDC + SSM</text>
  <text x="190.0" y="816" text-anchor="middle" class="node-sub">fetch databricks_client_id</text>
  <text x="50" y="827" class="lane-header">DATABRICKS APPS RUNTIME (dbc-bad72b2f-9f59.cloud.databricks.com)</text>
  <rect x="60" y="845" width="540" height="115" rx="10" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="80" y="868" class="node-title">shine-v2-dev (target: dev)</text>
  <text x="580" y="868" text-anchor="end" class="node-sub">*.aws.databricksapps.com</text>
  <rect x="80" y="880" width="250" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="205.0" y="904" text-anchor="middle" class="node-title">Elysia API (tsx)</text>
  <text x="205.0" y="922" text-anchor="middle" class="node-sub">src/index.ts · routes/ · auth/</text>
  <text x="205.0" y="942" text-anchor="middle" class="node-meta">AUTH_MODE=gateway OPENAPI=off</text>
  <rect x="345" y="880" width="240" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="465.0" y="904" text-anchor="middle" class="node-title">Static frontend (api/public/)</text>
  <text x="465.0" y="922" text-anchor="middle" class="node-sub">Astro dist served by Elysia</text>
  <text x="465.0" y="942" text-anchor="middle" class="node-meta">SHINE · FOE · RIC · Prima</text>
  <rect x="640" y="845" width="540" height="115" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="660" y="868" class="node-title">shine-v2 (target: prod)</text>
  <text x="1160" y="868" text-anchor="end" class="node-sub">*.aws.databricksapps.com</text>
  <rect x="660" y="880" width="250" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="785.0" y="904" text-anchor="middle" class="node-title">Elysia API (tsx)</text>
  <text x="785.0" y="922" text-anchor="middle" class="node-sub">same image as dev</text>
  <text x="785.0" y="942" text-anchor="middle" class="node-meta">AUTH_MODE=gateway OPENAPI=off</text>
  <rect x="925" y="880" width="240" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.0" y="904" text-anchor="middle" class="node-title">Static frontend (api/public/)</text>
  <text x="1045.0" y="922" text-anchor="middle" class="node-sub">artifact promoted from dev SHA</text>
  <text x="1045.0" y="942" text-anchor="middle" class="node-meta">SHINE · FOE · RIC · Prima</text>
  <rect x="70" y="1030" width="320" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="1054" text-anchor="middle" class="node-title">bdd-post-deploy (dev only)</text>
  <text x="230.0" y="1072" text-anchor="middle" class="node-sub">Playwright BDD against deployed app_url</text>
  <text x="230.0" y="1092" text-anchor="middle" class="node-meta">--grep-invert @wip · on success: create GitHub Release</text>
  <rect x="420" y="1030" width="360" height="90" rx="8" fill="#fef9c3" stroke="#facc15" stroke-width="2" filter="url(#shadow)"/>
  <text x="600.0" y="1054" text-anchor="middle" class="node-title">Release tag v0.1.${run_number}</text>
  <text x="600.0" y="1072" text-anchor="middle" class="node-sub">closes the loop: a green dev deploy</text>
  <text x="600.0" y="1092" text-anchor="middle" class="node-meta">cuts the release that triggers prod</text>
  <rect x="810" y="1030" width="410" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015.0" y="1054" text-anchor="middle" class="node-title">End users (browser)</text>
