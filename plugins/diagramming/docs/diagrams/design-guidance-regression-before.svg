<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640">
  <defs>
    <style>text { font-family: Arial, sans-serif; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555555"/></marker>
  </defs>
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="560" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Before: No Default Design Guidance</text>
  <text x="560" y="72" text-anchor="middle" font-size="13" fill="#666666">The same output-format flow renders, but colors, grouping, generated-artifact treatment, and typography are ad hoc.</text>

  <rect x="64" y="132" width="186" height="92" rx="2" fill="#ffe5e5" stroke="#a60000" stroke-width="2"/>
  <text x="157" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">request</text>
  <text x="157" y="190" text-anchor="middle" font-size="12" fill="#222222">"PNG only"</text>

  <rect x="344" y="116" width="214" height="124" rx="18" fill="#e6e6ff" stroke="#4040ff" stroke-width="3"/>
  <text x="451" y="153" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">routing</text>
  <text x="451" y="178" text-anchor="middle" font-size="12" fill="#333333">infer formats</text>
  <text x="451" y="200" text-anchor="middle" font-size="12" fill="#333333">no template rule</text>

  <rect x="642" y="132" width="192" height="92" rx="0" fill="#e5ffe5" stroke="#009900" stroke-width="2"/>
  <text x="738" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">contract</text>
  <text x="738" y="190" text-anchor="middle" font-size="12" fill="#222222">output.formats [png]</text>

  <rect x="908" y="118" width="156" height="120" rx="6" fill="#fff7cc" stroke="#b58900" stroke-width="2"/>
  <text x="986" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">artifact</text>
  <rect x="944" y="176" width="84" height="34" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <text x="986" y="198" text-anchor="middle" font-size="12" fill="#111111">PNG</text>

  <line x1="250" y1="178" x2="342" y2="178" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="558" y1="178" x2="640" y2="178" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="834" y1="178" x2="906" y2="178" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="154" y="330" width="812" height="184" fill="#f7f7f7" stroke="#999999" stroke-width="1.5"/>
  <text x="560" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Visible issues in the baseline</text>
  <text x="226" y="410" font-size="13" fill="#222222">1. Semantic colors are mixed with decorative colors.</text>
  <text x="226" y="438" font-size="13" fill="#222222">2. Generated artifacts are not visually distinguished from human-authored inputs.</text>
  <text x="226" y="466" font-size="13" fill="#222222">3. Parallel concepts are not grouped, so reviewers must infer structure.</text>
  <text x="226" y="494" font-size="13" fill="#222222">4. Typography, radius, and stroke weights vary without meaning.</text>
</svg>
