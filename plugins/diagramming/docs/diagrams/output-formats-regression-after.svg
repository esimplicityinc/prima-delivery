<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520">
  <defs>
    <style>text { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
    <marker id="success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0284c7" stroke-width="1" opacity="0.22"/></pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="520" fill="#ffffff"/>
  <text x="560" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">After: Request-Selectable Output Formats</text>
  <text x="560" y="70" text-anchor="middle" font-size="13" fill="#475569">Natural language now drives output.formats while validation intermediates stay internal.</text>

  <g filter="url(#soft)"><rect x="90" y="138" width="250" height="106" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/></g>
  <text x="215" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">User request</text>
  <text x="215" y="196" text-anchor="middle" font-size="12" fill="#475569">"Diagram this flow"</text>
  <text x="215" y="216" text-anchor="middle" font-size="12" fill="#475569">"PNG only"</text>

  <g filter="url(#soft)"><rect x="435" y="138" width="250" height="106" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/></g>
  <text x="560" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Routing agent</text>
  <text x="560" y="196" text-anchor="middle" font-size="12" fill="#475569">output.formats</text>
  <text x="560" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">["png"]</text>

  <g filter="url(#soft)"><rect x="780" y="138" width="250" height="106" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/></g>
  <text x="905" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Delivered artifact</text>
  <rect x="832" y="196" width="146" height="30" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/>
  <text x="905" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">diagram.png</text>

  <line x1="340" y1="191" x2="433" y2="191" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="685" y1="191" x2="778" y2="191" stroke="#15803d" stroke-width="2.2" marker-end="url(#success)"/>

  <g filter="url(#soft)"><rect x="164" y="325" width="792" height="94" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.8"/></g>
  <text x="560" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Default design template also applied</text>
  <rect x="252" y="374" width="26" height="16" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="288" y="387" font-size="12" fill="#111827">inputs</text>
  <rect x="420" y="374" width="26" height="16" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="456" y="387" font-size="12" fill="#111827">processes</text>
  <rect x="620" y="374" width="26" height="16" fill="url(#hatch)" stroke="#0284c7"/>
  <text x="656" y="387" font-size="12" fill="#111827">generated</text>
  <rect x="790" y="374" width="26" height="16" fill="#dcfce7" stroke="#15803d"/>
  <text x="826" y="387" font-size="12" fill="#111827">gates</text>
</svg>
